[project]
name = "feishu-partner"
version = "0.1.0"
description = "本地独立的飞书办公智能体 CLI"
requires-python = ">=3.10"

dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "black>=25.0",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",     # line too long (handled by black)
    "W505",     # doc line too long
    "SIM108",   # use ternary operator
    "SIM115",   # use context manager for open()
    "SIM117",   # multiple with statements
    "UP007",    # use X | Y for Union (we already use it)
    "RUF001",   # ambiguous unicode in string (Chinese chars are intentional)
    "RUF002",   # ambiguous unicode in docstring
    "RUF003",   # ambiguous unicode in comment
    "TID252",   # relative imports (project convention)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
# Docstring-before-imports is valid Python; ruff flags it as E402
"partner/actions.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["partner"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert_used (common in tests, but we exclude tests)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=partner --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["partner"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
